<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#F2FFFE" />
    <title>GoGoVideo</title>
    <link rel="preconnect" href="https://api.gogovideo.ru" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        margin: 0;
        background: #F2FFFE;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .app-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 16px;
      }
      .app-loader svg {
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .app-loader p {
        color: #7A7A85;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#00C9B7" stroke-width="2.5" stroke-linecap="round">
          <path d="M12 2a10 10 0 0 1 10 10" />
        </svg>
        <p>Загрузка...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
